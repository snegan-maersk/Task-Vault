<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 14px;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .task-list {
            list-style: none;
            padding: 0;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .no-tasks {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Task Vault</h1>
        
        <div class="add-task">
            <input 
                v-model="newTask" 
                @keyup.enter="addTask" 
                placeholder="Enter a new task..." 
            />
            <button @click="addTask">Add Task</button>
        </div>

        <ul class="task-list" v-if="tasks.length > 0">
            <li v-for="task in tasks" :key="task.id" class="task-item">
                <span>{{ task.title }}</span>
                <button class="delete-btn" @click="deleteTask(task.id)">Delete</button>
            </li>
        </ul>

        <div v-else class="no-tasks">
            No tasks yet. Add one above!
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
